name: Engineering QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "security/**"

permissions:
  contents: write
  actions: write

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The current committed lockfile is missing lru-cache@11.5.3. On our
      # own security branch only, refresh the lockfile without lifecycle scripts
      # and commit that deterministic metadata before doing a clean npm ci.
      - name: Refresh stale npm lockfile on security branch
        id: locksync
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/security/')
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile for CI"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN pushes do not start new push workflows. Dispatch a second
      # run so status checks include the new lockfile commit as the branch head.
      - name: Run QA on refreshed lockfile commit
        if: steps.locksync.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "qa.yml",
              ref: process.env.GITHUB_REF_NAME
            });

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Summarize verification
        if: always()
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          printf 'Typecheck: %s\nTests: %s\nLint: %s\nBuild: %s\n' \
            "$TYPECHECK_OUTCOME" "$TESTS_OUTCOME" "$LINT_OUTCOME" "$BUILD_OUTCOME"
          test "$TYPECHECK_OUTCOME" = "success" &&
          test "$TESTS_OUTCOME" = "success" &&
          test "$LINT_OUTCOME" = "success" &&
          test "$BUILD_OUTCOME" = "success"
