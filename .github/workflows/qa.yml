name: Engineering QA

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "security/**"

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Summarize verification
        if: always()
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          printf 'Typecheck: %s\nTests: %s\nLint: %s\nBuild: %s\n' \
            "$TYPECHECK_OUTCOME" "$TESTS_OUTCOME" "$LINT_OUTCOME" "$BUILD_OUTCOME"
          test "$TYPECHECK_OUTCOME" = "success" &&
          test "$TESTS_OUTCOME" = "success" &&
          test "$LINT_OUTCOME" = "success" &&
          test "$BUILD_OUTCOME" = "success"
